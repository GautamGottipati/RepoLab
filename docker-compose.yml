services:
  postgres:
    image: postgres:16-alpine
    container_name: repolab-postgres
    environment:
      POSTGRES_USER: repolab
      POSTGRES_PASSWORD: repolab
      POSTGRES_DB: repolab
    ports:
      - "5432:5432"
    volumes:
      - repolab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repolab -d repolab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: repolab-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  repolab-pgdata:
