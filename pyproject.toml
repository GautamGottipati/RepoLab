[project]
name = "repolab"
version = "0.1.0"
description = "Agentic experimentation and learning environment for real software"
requires-python = "==3.11.*"
dependencies = [
    "openai>=2.0",
    "contree-sdk>=0.3.6",
    "tavily-python>=0.8.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "rq>=2.0",
    "redis>=5.2",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "structlog>=24.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["repolab"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Markdown is documentation, not source: the formatter must not rewrite the
# illustrative code blocks in CLAUDE.md and docs/.
# alembic/versions holds autogenerated migrations; they are reviewed, not
# restyled. env.py and the template stay linted.
extend-exclude = ["*.md", "web", "alembic/versions"]

[tool.ruff.lint]
# BLE is enabled deliberately: probes catch broad exceptions on purpose, and
# each one carries a justifying `noqa` so new unjustified ones get flagged.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Live tests are deselected by default so `make test` never needs credentials
# or network access. Run them with `make smoke`.
addopts = "-q -m 'not live and not network and not docker and not slow'"
markers = [
    "live: requires real credentials and network access (run via `make smoke`)",
    "network: requires network access but no credentials (run via `make check-repos`)",
    "docker: requires a running Docker daemon (run via `make test-docker`)",
    "slow: takes many minutes of real compute (run via `make test-slow`)",
]
